# ═══════════════════════════════════════════════════════════
# Docker Compose - Arma Multiclan Platform
# ═══════════════════════════════════════════════════════════
#
# Uso:
#   Primera vez: docker compose up -d --build
#   Actualizar:  docker compose up -d --build
#   Logs:        docker compose logs -f
#   Parar:       docker compose down
#   Producción:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# ═══════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────
  # Base de Datos PostgreSQL
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arma_password_segura}
      POSTGRES_DB: ${POSTGRES_DB:-arma_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arma_user} -d ${POSTGRES_DB:-arma_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Backend API (Node.js + Express + Prisma)
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-arma_user}:${POSTGRES_PASSWORD:-arma_password_segura}@postgres:5432/${POSTGRES_DB:-arma_platform}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      FRONTEND_PORT: ${FRONTEND_PORT:-80}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@arma.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-Admin}
    volumes:
      - backend_uploads:/app/public/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ─────────────────────────────────────────────────────────
  # Frontend (React + Nginx reverse proxy)
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_TLS_PORT: ${FRONTEND_PORT:-8443}
    volumes:
      - ${TLS_CERT_PATH:-./docker/certs/frontend-selfsigned.crt}:/etc/nginx/certs/tls.crt:ro
      - ${TLS_KEY_PATH:-./docker/certs/frontend-selfsigned.key}:/etc/nginx/certs/tls.key:ro
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
      - "${FRONTEND_PORT:-8443}:443"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--no-verbose", "--tries=1", "--spider", "https://127.0.0.1:443"]
      interval: 30s
      timeout: 10s
      retries: 3

# ─────────────────────────────────────────────────────────
# Volúmenes persistentes
# ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: arma-postgres-data
  backend_uploads:
    name: arma-backend-uploads
